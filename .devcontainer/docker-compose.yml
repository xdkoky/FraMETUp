services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ..:/workspaces/FraMETUp:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://director:director@db:5432/director_os?schema=public
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: director
      POSTGRES_PASSWORD: director
      POSTGRES_DB: director_os
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
